<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 112" width="860" height="112" role="img" aria-labelledby="ti de" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="ti">Featured Work</title><desc id="de">Orbyt, Multi-Agent Disaster Response AI and UniMind.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1630"/><stop offset="1" stop-color="#060a15"/></linearGradient>
<pattern id="iso" width="52" height="30" patternUnits="userSpaceOnUse"><path d="M0 0L52 30M52 0L0 30" stroke="#7aa2ff" stroke-opacity=".075" fill="none"/></pattern>
<radialGradient id="vg" cx=".5" cy=".5" r=".78"><stop offset=".5" stop-color="#050813" stop-opacity="0"/><stop offset="1" stop-color="#050813" stop-opacity=".9"/></radialGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7df3ff"/><stop offset=".5" stop-color="#b79cff"/><stop offset="1" stop-color="#ffa6e4"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2552"/><stop offset="1" stop-color="#0f1733"/></linearGradient>
<linearGradient id="card2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18224a"/><stop offset="1" stop-color="#0b1228"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="shd" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".75"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
<text id="hfw" x="100" y="66" font-size="40" font-weight="800" text-anchor="start" letter-spacing="-.5">Featured Work</text><clipPath id="chfw"><use href="#hfw"/></clipPath><clipPath id="cl"><rect width="860" height="112" rx="22"/></clipPath></defs>
<style>
.fl{animation:fl 5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--a,-7px))}}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 5s ease-in-out infinite}
@keyframes sh{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(.82);opacity:.28}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.pl{transform-box:fill-box;transform-origin:center;animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.35);opacity:.15}}
.fd{stroke-dasharray:5 9;animation:fd 1.4s linear infinite}
@keyframes fd{to{stroke-dashoffset:-14}}
.lit{animation:lit 7s ease-in-out infinite}
@keyframes lit{0%,100%{opacity:.35}6%,16%{opacity:1}30%{opacity:.35}}
.tl{animation:tl 4s ease-in-out infinite}
@keyframes tl{0%,100%{opacity:1}50%{opacity:.5}}
.bl{animation:bl 1.8s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
.sc{animation:sc 3.2s ease-in-out infinite}
@keyframes sc{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(var(--h,60px));opacity:0}}
.rs{animation:rs 6s linear infinite;opacity:0}
@keyframes rs{0%{transform:translateY(20px);opacity:0}15%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
